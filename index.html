<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Для лучшего друга</title>
    <style>
        /* БАЗА И ФОН */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0a0a12;
            color: #fff;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(120, 0, 255, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(0, 200, 255, 0.15) 0%, transparent 40%);
            min-height: 100vh;
        }

        /* ГЛАВНЫЙ ЭКРАН */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        .hero h1 {
            font-size: clamp(2.5rem, 10vw, 5rem);
            background: linear-gradient(90deg, #00f2fe, #4facfe, #ff00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: glow 3s ease-in-out infinite alternate;
            margin-bottom: 20px;
        }
        .hero p { font-size: 1.2rem; opacity: 0.8; max-width: 600px; }
        
        @keyframes glow {
            from { filter: drop-shadow(0 0 5px rgba(0, 242, 254, 0.3)); }
            to { filter: drop-shadow(0 0 20px rgba(255, 0, 255, 0.5)); }
        }

        /* СЕКЦИИ И АНИМАЦИИ ПОЯВЛЕНИЯ */
        section { padding: 60px 20px; max-width: 1200px; margin: 0 auto; }
        .reveal {
            opacity: 0;
            transform: translateY(50px);
            transition: all 0.8s cubic-bezier(0.5, 0, 0, 1);
        }
        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        h2 {
            font-size: 2rem;
            text-align: center;
            margin-bottom: 40px;
            color: #4facfe;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* ГАЛЕРЕЯ (СЕТКА) */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }
        .photo-card {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            aspect-ratio: 1/1;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .photo-card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 20px 40px rgba(0, 242, 254, 0.2);
        }
        .photo-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s;
        }
        .photo-card:hover img { transform: scale(1.1); }

        /* СЕКРЕТНАЯ ЧАСТЬ */
        .secret-zone {
            text-align: center;
            min-height: 400px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .lock-screen {
            background: rgba(255, 0, 100, 0.1);
            border: 2px dashed #ff0066;
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
        }
        .lock-screen h3 { color: #ff0066; margin-bottom: 20px; font-size: 1.5rem;}
        .unlock-btn {
            background: linear-gradient(45deg, #ff0066, #ff8c00);
            border: none;
            color: white;
            padding: 15px 30px;
            font-size: 1.1rem;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s;
        }
        .unlock-btn:active { transform: scale(0.95); }
        
        .hidden-gallery { display: none; }
        .hidden-gallery.show { display: grid; }
    </style>
</head>
<body>

    <!-- ГЛАВНЫЙ ЭКРАН -->
    <header class="hero">
        <h1>С ДНЁМ РОЖДЕНИЯ!</h1>
        <p>Листай вниз и не красней</p>
    </header>

    <section class="reveal">
        <h2>Скрытые фотографии</h2>
        <div class="gallery">
            <div class="photo-card"><img src="13.jpg" alt="Фото 21" loading="lazy"></div>
            <div class="photo-card"><img src="1.jpg" alt="Фото 19" loading="lazy"></div>
            <div class="photo-card"><img src="3.jpg" alt="Фото 1" loading="lazy"></div>
            <div class="photo-card"><img src="4.jpg" alt="Фото 2" loading="lazy"></div>
            <div class="photo-card"><img src="2.jpg" alt="Фото 3" loading="lazy"></div>
            <div class="photo-card"><img src="19.jpg" alt="Фото 4" loading="lazy"></div>
            <div class="photo-card"><img src="8.jpg" alt="Фото 5" loading="lazy"></div>
            <div class="photo-card"><img src="18.jpg" alt="Фото 6" loading="lazy"></div>
            <div class="photo-card"><img src="15.jpg" alt="Фото 7" loading="lazy"></div>
            <div class="photo-card"><img src="17.jpg" alt="Фото 8" loading="lazy"></div>
            <div class="photo-card"><img src="5.jpg" alt="Фото 9" loading="lazy"></div>
            <div class="photo-card"><img src="6.jpg" alt="Фото 10" loading="lazy"></div>
            <div class="photo-card"><img src="11.jpg" alt="Фото 11" loading="lazy"></div>
            <div class="photo-card"><img src="16.jpg" alt="Фото 20" loading="lazy"></div>
            <div class="photo-card"><img src="12.jpg" alt="Фото 12" loading="lazy"></div>
             <div class="photo-card"><img src="9.jpg" alt="Фото 15" loading="lazy"></div>
            <div class="photo-card"><img src="10.jpg" alt="Фото 13" loading="lazy"></div>
            <div class="photo-card"><img src="14.jpg" alt="Фото 14" loading="lazy"></div>
            <div class="photo-card"><img src="20.jpg" alt="Фото 16" loading="lazy"></div>
            <div class="photo-card"><img src="21.jpg" alt="Фото 17" loading="lazy"></div>
            <div class="photo-card"><img src="22.jpg" alt="Фото 18" loading="lazy"></div>
        </div>
    </section>

    <!-- СЕКРЕТНАЯ ЧАСТЬ (1 ФОТКА) -->
    <section class="secret-zone reveal">
        <div class="lock-screen" id="lockScreen">
            <h3>🔒 Зона строгого режима</h3>
            <p>Здесь лежит то, что не для чужих глаз.</p>
            <br>
            <button class="unlock-btn" onclick="unlockSecret()">Взломать систему</button>
        </div>
        
        <div class="gallery hidden-gallery" id="secretGallery">
            <h2 style="grid-column: 1/-1; color: #ff0066;">Секретный архив 🤫</h2>
            <div class="photo-card"><img src="7.jpg" alt="Секрет 1" loading="lazy"></div>
        </div>
    </section>

    <script>
        // 1. Анимация появления при скролле
        const reveals = document.querySelectorAll('.reveal');
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('active');
                }
            });
        }, { threshold: 0.1 });
        reveals.forEach(el => observer.observe(el));

        // 2. Логика секретной части
        function unlockSecret() {
            const pass = prompt("Введи пароль, чтобы открыть архив:");
            if (pass === "0704") { // ПОМЕНЯЙ ПАРОЛЬ ЗДЕСЬ
                document.getElementById('lockScreen').style.display = 'none';
                document.getElementById('secretGallery').classList.add('show');
                if (navigator.vibrate) navigator.vibrate(100); 
            } else {
                alert("Доступ запрещен! Пароль неверный.");
            }
        }
    </script>
</body>
</html>
